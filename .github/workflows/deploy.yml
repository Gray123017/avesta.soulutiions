# Deploys to Hostinger — but only once the checks have passed.
#
# Why it is built this way:
#
# Hostinger's own Git integration can pull on every push if you paste its
# webhook straight into GitHub. That works, but it deploys whatever was pushed,
# including a commit that breaks the site. This workflow waits for "Check
# Hostinger site" to go green and only then asks Hostinger to pull, so a broken
# commit stops at GitHub instead of reaching customers.
#
# Why a git pull and not an FTP sync:
#
# public_html holds live applicant records — records_data.php, users.php and
# the NRC scans under documents/ — none of which are in the repository. A git
# pull leaves untracked files alone, so it cannot touch them. An FTP mirror
# with "delete files not in source" would erase them on the first run. Do not
# swap this for one. The same goes for the installers under downloads/, which
# are kept on Hostinger and deliberately not committed.
#
# Setting it up once:
#   1. hPanel → Websites → avesta.solutions → Advanced → GIT
#      Repository: https://github.com/Gray123017/avesta.soulutiions.git
#      Branch: main      Directory: (leave empty for public_html)
#   2. On that same page, copy the deployment webhook URL.
#   3. GitHub → repo → Settings → Secrets and variables → Actions →
#      New repository secret, named HOSTINGER_DEPLOY_HOOK, pasted as the value.
#
# Note: workflow_run only fires for a workflow file that is on the default
# branch, so this does nothing until it is merged to main.
#
# Without that secret the workflow does not fail; it says it is not configured
# and stops, so the repository still works for anyone who clones it.

name: Deploy to Hostinger

on:
  workflow_run:
    workflows: ["Check Hostinger site"]
    types: [completed]
    branches: [main]
  # Lets you push the button yourself in the Actions tab when you need to.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time. A second push while the first is still pulling would
  # otherwise leave the site half-updated.
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only after a green run. A failed check never reaches the site.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Hostinger to pull
        env:
          HOOK: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::HOSTINGER_DEPLOY_HOOK is not set, so nothing was deployed."
            echo "Add it under Settings → Secrets and variables → Actions to switch this on."
            exit 0
          fi

          echo "Triggering the Hostinger deployment webhook."
          code=$(curl -sS -o /tmp/hook-response.txt -w '%{http_code}' \
                      --max-time 60 --retry 2 --retry-delay 5 "$HOOK")

          echo "Hostinger replied with HTTP $code"
          head -c 500 /tmp/hook-response.txt || true
          echo

          # Hostinger answers 2xx when it has accepted the pull. Anything else
          # means the site was not updated, and that must fail loudly rather
          # than leaving everyone believing a deploy happened.
          case "$code" in
            2*) echo "::notice::Hostinger accepted the deployment." ;;
            *)  echo "::error::Hostinger did not accept the deployment (HTTP $code)."
                exit 1 ;;
          esac

      - name: What to check now
        if: success()
        run: |
          echo "Hostinger pulls in the background, so give it a minute, then check:"
          echo "  https://avesta.solutions/              the site loads"
          echo "  https://avesta.solutions/documents/    must still answer 403 or 404"
          echo ""
          echo "A deploy never removes files that are not in the repository, so"
          echo "applicant records and uploaded documents are left untouched."
