name: Check Hostinger site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Protect software download catalogue
        run: |
          # Installers are retained on Hostinger and are intentionally not committed to Git.
          # Guard the exact public paths so a site deployment cannot silently orphan them.
          grep -Fq "/downloads/asset-tracker/GIT-Asset-Tracker-1.5.1-Windows.zip" downloads.php || { echo "::error::Asset Tracker download link is missing from downloads.php"; exit 1; }
          grep -Fq "/downloads/g-it/G-IT-Setup-x64.exe" downloads.php || { echo "::error::Device Health installer link is missing from downloads.php"; exit 1; }
          grep -Fq "/downloads/moneytrack/Avesta-MoneyTrack-1.2.0-Windows-x64-Setup.exe" downloads.php || { echo "::error::MoneyTrack 1.2.0 download link is missing from downloads.php"; exit 1; }
      - name: Check PHP syntax
        run: find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check public PHP routes and account gate
        run: |
          php -S 127.0.0.1:8080 > /tmp/avesta-php.log 2>&1 &
          node scripts/check-php.mjs
