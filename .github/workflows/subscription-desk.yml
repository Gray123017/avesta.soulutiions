name: Subscription Desk desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/subscription-desk/**'
      - '.github/workflows/subscription-desk.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/subscription-desk/**'
      - '.github/workflows/subscription-desk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            script: dist:linux
            artifact: linux-amd64
          - os: windows-2025
            script: dist:windows
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/subscription-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/subscription-desk/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Embed publisher-owned OAuth client configuration
        run: node scripts/configure-publisher-oauth.cjs
        env:
          SUBSCRIPTION_TRACKER_GOOGLE_CLIENT_ID: ${{ vars.SUBSCRIPTION_TRACKER_GOOGLE_CLIENT_ID }}
          SUBSCRIPTION_TRACKER_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.SUBSCRIPTION_TRACKER_GOOGLE_DESKTOP_CLIENT_SECRET }}
          SUBSCRIPTION_TRACKER_MICROSOFT_CLIENT_ID: ${{ vars.SUBSCRIPTION_TRACKER_MICROSOFT_CLIENT_ID }}
      - name: Require verified Google sign-in before packaging
        env:
          SUBSCRIPTION_TRACKER_GOOGLE_LIVE_TEST_APPROVED: ${{ vars.SUBSCRIPTION_TRACKER_GOOGLE_LIVE_TEST_APPROVED }}
        run: node scripts/assert-google-release-ready.cjs
      - name: Install RPM verification tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Run Linux desktop interaction checks
        if: runner.os == 'Linux'
        run: |
          npm install --no-save playwright
          xvfb-run -a npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: subscription-desk-${{ matrix.artifact }}
          path: |
            desktop/subscription-desk/dist/linux-package/*.deb
            desktop/subscription-desk/dist/linux-package/*.rpm
            desktop/subscription-desk/dist/*.exe
          if-no-files-found: error
          retention-days: 30
